name: Patrick Behnke
title: Patrick Behnke
tagline: Platform Engineering with a specialty in Automation
description: >-
  Patrick Behnke: platform engineer specializing in automation.
  Projects, writing, and contact info.

# Short bio shown on the homepage. Markdown is allowed.
bio: >-
  I'm a platform engineer who builds the paved roads other engineers drive on:
  CI/CD pipelines, infrastructure as code, and the automation that turns
  repetitive toil into a single command. I care about systems that are
  boring to operate, easy to reason about, and fast to change.

email: behnke.tech.2010@gmail.com
github_username: Sherlock64
# Your LinkedIn profile URL, e.g. https://www.linkedin.com/in/your-handle
