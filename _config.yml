# ---------------------------------------------------------------------
resume_request:
  button_label: Request my resume
  subject: "Resume Request – Patrick Behnke"
  body: |-
    Hi Patrick,

    I'd like to request a copy of your resume.

    Name:
    Company:
    Role/Opportunity:

    Details:

    Thanks!

# How many recent posts to show on the homepage.
homepage_posts: 3

