<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title | escape }} · {% endif %}{{ site.name | escape }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#16181d">
  <script>
    /* Dark by default; remembers the visitor's choice from the theme toggle. */
    (function () {
      var t = "dark";
      try { t = localStorage.getItem("theme") || "dark"; } catch (e) {}
      var r = document.documentElement;
      r.setAttribute("data-theme", t);
      r.className = r.className.replace("no-js", "js");
    })();
  </script>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.name | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233f51b5'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3EPB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- display=optional: use Roboto only if it arrives right away, so text never reflows. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=optional">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
